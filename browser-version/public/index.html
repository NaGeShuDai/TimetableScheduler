<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海南大学空课与排班</title><link rel="icon" href="assets/app.ico"><link rel="stylesheet" href="style.css"></head><body><header><img src="assets/app-icon.png" alt=""><div><strong>海南大学空课与排班</strong><small>本地浏览器版</small></div><nav><button data-view="people"><i data-lucide="users"></i>人员与课表</button><button data-view="free"><i data-lucide="calendar-days"></i>空课表</button><button data-view="schedule"><i data-lucide="calendar-check"></i>排班表</button></nav><button id="home" title="首页"><i data-lucide="house"></i></button></header><main><section id="welcome"><img src="assets/app-icon.png" alt="课表图标"><h1>海南大学空课与排班</h1><button id="enter"><i data-lucide="arrow-right"></i>进入系统</button></section><section id="workspace" hidden><div class="top"><label>教学周 <input id="week" type="number" min="1" max="60" value="1"></label><span id="term"></span><button id="times"><i data-lucide="clock"></i>时段设置</button><button id="backup"><i data-lucide="download"></i>备份数据</button><button id="restore"><i data-lucide="upload"></i>恢复数据</button></div><div id="toolbar"></div><div id="content"></div></section></main><footer id="status" role="status">就绪</footer><dialog id="dialog"><form id="form"><div class="modalhead"><h2 id="dialog-title"></h2><button type="button" id="close" title="关闭"><i data-lucide="x"></i></button></div><div id="dialog-body"></div><div class="actions"><button type="button" id="cancel">取消</button><button type="submit" class="primary">保存</button></div></form></dialog><input id="files" type="file" multiple accept=".xls,.xlsx" hidden><input id="jsonfile" type="file" accept=".json" hidden><script src="app.js"></script></body></html>
